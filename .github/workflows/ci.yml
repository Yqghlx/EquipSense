# EquipSense CI/CD 流水线
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: yqghlx/equipsense

jobs:
  # ============================================================================
  # 后端构建 + 测试
  # ============================================================================
  backend:
    name: 后端测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原依赖
        run: dotnet restore EquipAI.slnx

      - name: 构建后端
        run: dotnet build EquipAI.slnx --configuration Release --no-restore

      - name: 运行单元测试
        run: dotnet test tests/EquipAI.Tests.Unit/EquipAI.Tests.Unit.csproj --configuration Release --no-build --verbosity normal

      - name: 运行集成测试
        run: dotnet test tests/EquipAI.Tests.Integration/EquipAI.Tests.Integration.csproj --configuration Release --no-build --verbosity normal

  # ============================================================================
  # 前端构建 + 测试
  # ============================================================================
  frontend:
    name: 前端测试
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc -p tsconfig.json --noEmit

      - name: Lint 检查
        run: npx eslint src/ --max-warnings 1

      - name: 运行单元测试
        run: npx vitest run

      - name: 构建前端
        run: npm run build

  # ============================================================================
  # Docker 镜像构建 + 推送（仅 main 分支）
  # ============================================================================
  docker:
    name: Docker 构建与推送
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取短 SHA
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.meta.outputs.sha_short }}

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta.outputs.sha_short }}

  # ============================================================================
  # E2E 测试（仅 main 分支，CI 内启动前后端）
  # ============================================================================
  e2e:
    name: E2E 测试
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: test_pw
          POSTGRES_DB: equipai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: 设置 .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 还原并构建后端
        run: |
          dotnet restore EquipAI.slnx
          dotnet build EquipAI.slnx --configuration Release --no-restore

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 启动后端服务
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:8080
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=equipai_test;Username=postgres;Password=test_pw"
          Redis__ConnectionString: "localhost:6379"
          Jwt__Secret: "e2e-test-secret-key-that-is-at-least-32-characters-long!!"
        run: |
          dotnet run --project src/EquipAI.WebAPI --no-build --configuration Release &
          # 等待后端健康检查通过（最多 60 秒）
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "后端服务已启动"
              break
            fi
            echo "等待后端启动... ($i/30)"
            sleep 2
          done

      - name: 启动前端开发服务器
        working-directory: frontend
        run: |
          npx vite --host 0.0.0.0 --port 5173 &
          # 等待前端服务就绪（最多 30 秒）
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "前端服务已启动"
              break
            fi
            echo "等待前端启动... ($i/15)"
            sleep 2
          done

      - name: 运行 E2E 测试
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          CI: true
        run: npx playwright test e2e-comprehensive --reporter=list

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e-comprehensive/test-results/
          retention-days: 7
