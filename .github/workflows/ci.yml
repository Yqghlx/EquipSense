# EquipSense CI/CD 流水线
name: CI/CD

on:
  # 自动触发：push 到主分支或针对主分支的 PR
  # paths 过滤避免只改文档/输出时白跑测试
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'output/**'
      - 'coverage-results/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'output/**'
      - 'coverage-results/**'
  workflow_dispatch:  # 保留手动触发能力（紧急验证 / 选择性重跑）

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: yqghlx/equipsense

jobs:
  # ============================================================================
  # 密钥泄露扫描（Gitleaks）— 安全门禁，发现泄露即阻断
  # 作用：防止私钥、API Key、密码等被意外提交到仓库
  # ============================================================================
  secret-scan:
    name: 密钥泄露扫描
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks 需要完整 git 历史才能扫描所有提交
          fetch-depth: 0

      - name: Gitleaks 扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          # 使用免费开源探测规则，无需配置 GitHub Secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # ============================================================================
  # 后端构建 + 测试
  # ============================================================================
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    # 密钥泄露必须先通过，再跑构建（避免在含泄露的代码上浪费资源）
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - name: 设置 .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原依赖
        run: dotnet restore EquipAI.slnx

      - name: 构建后端
        run: dotnet build EquipAI.slnx --configuration Release --no-restore

      - name: 运行单元测试
        run: dotnet test tests/EquipAI.Tests.Unit/EquipAI.Tests.Unit.csproj --configuration Release --no-build --verbosity normal

      - name: 运行集成测试
        run: dotnet test tests/EquipAI.Tests.Integration/EquipAI.Tests.Integration.csproj --configuration Release --no-build --verbosity normal

      # NuGet 包漏洞检查 — 发现已知 CVE 即阻断 CI
      # 若确需暂缓修复某 CVE，在 nuget 包配置中显式忽略，而非关闭门禁
      - name: 检查 NuGet 依赖漏洞（阻断）
        run: dotnet list EquipAI.slnx package --vulnerable --include-transitive

  # ============================================================================
  # 前端构建 + 测试
  # ============================================================================
  frontend:
    name: 前端测试
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc -p tsconfig.json --noEmit

      - name: i18n 键覆盖检查
        run: npm run check:i18n

      - name: Lint 检查
        run: npx eslint src/ --max-warnings 1

      - name: 运行单元测试
        run: npx vitest run

      - name: 构建前端
        run: npm run build

      # 前端依赖漏洞检查 — 发现未登记的 high/critical 即阻断。
      # 脚本只对已核实的 React Router RSC-only 公告保留精确例外。
      - name: npm 生产依赖审计
        run: node scripts/check-production-audit.mjs

  # ============================================================================
  # Docker 镜像构建 + 推送（仅 main 分支）
  # ============================================================================
  docker:
    name: Docker 构建与推送
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取短 SHA
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.meta.outputs.sha_short }}

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta.outputs.sha_short }}

      # ========================================================
      # 安全扫描：Trivy 扫描镜像已知漏洞（CVE）— HIGH/CRITICAL 阻断
      # ========================================================
      - name: Trivy 扫描后端镜像
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.meta.outputs.sha_short }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Trivy 扫描前端镜像
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta.outputs.sha_short }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # ============================================================================
  # E2E 测试（仅 main 分支，CI 内启动前后端）
  # ============================================================================
  e2e:
    name: E2E 测试
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'pull_request'
    needs: [backend, frontend]

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: test_pw
          POSTGRES_DB: equipai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: 设置 .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 还原并构建后端
        run: |
          dotnet restore EquipAI.slnx
          dotnet build EquipAI.slnx --configuration Release --no-restore

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 启动后端服务
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:8080
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=equipai_test;Username=postgres;Password=test_pw"
          Redis__ConnectionString: "localhost:6379"
          Jwt__Secret: "e2e-test-secret-key-that-is-at-least-32-characters-long!!"
          DISABLE_RATE_LIMITING: "true"
          # E2E 跨租户隔离测试（permission-denied.spec.ts）依赖第二租户账户
          SEED_TENANT2_ACCOUNT: "true"
        run: |
          dotnet run --project src/EquipAI.WebAPI --no-build --configuration Release &
          # 等待后端健康检查通过（最多 90 秒）
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "后端服务已启动"
              break
            fi
            echo "等待后端启动... ($i/45)"
            sleep 2
          done

      - name: 启动前端开发服务器
        working-directory: frontend
        run: |
          npx vite --host 0.0.0.0 --port 5173 &
          # 等待前端服务就绪（最多 30 秒）
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "前端服务已启动"
              break
            fi
            echo "等待前端启动... ($i/15)"
            sleep 2
          done

      - name: 运行 E2E 测试
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          CI: true
        run: npx playwright test e2e-comprehensive --reporter=list

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e-comprehensive/test-results/
          retention-days: 7
