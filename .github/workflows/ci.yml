# EquipSense CI/CD 流水线
# 触发条件：push 到 main/develop 分支 或 PR 到 main
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # 后端构建 + 测试
  # ============================================================================
  backend:
    name: 后端测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原依赖
        run: dotnet restore EquipAI.sln

      - name: 构建后端
        run: dotnet build EquipAI.sln --configuration Release --no-restore

      - name: 运行单元测试
        run: dotnet test tests/EquipAI.Tests.Unit/EquipAI.Tests.Unit.csproj --configuration Release --no-build --verbosity normal

      - name: 运行集成测试
        run: dotnet test tests/EquipAI.Tests.Integration/EquipAI.Tests.Integration.csproj --configuration Release --no-build --verbosity normal

  # ============================================================================
  # 前端构建 + 测试
  # ============================================================================
  frontend:
    name: 前端测试
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 运行单元测试
        run: npx vitest run

      - name: 构建前端
        run: npm run build

  # ============================================================================
  # Docker 镜像构建验证（仅 main 分支）
  # ============================================================================
  docker:
    name: Docker 构建验证
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: 构建后端镜像
        run: docker build -f docker/Dockerfile.backend -t equipai-backend:test .

      - name: 构建前端镜像
        run: docker build -f docker/Dockerfile.frontend -t equipai-frontend:test .
