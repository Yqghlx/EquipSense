# EquipSense CI/CD 流水线
name: CI/CD

on:
  # push 触发：主/开发分支（路径过滤）+ 版本 tag（打镜像 semver 标签）
  # paths-ignore 仅作用于分支推送，tag 推送不带文件路径故自动忽略
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'output/**'
      - 'coverage-results/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'output/**'
      - 'coverage-results/**'
  workflow_dispatch:  # 保留手动触发能力（紧急验证 / 选择性重跑）

# 同一 workflow/event/ref 只允许一个活动流水线，避免旧的 main 运行在较新的提交之后覆盖 latest。
# 手动验证与 push/PR 隔离；分支、PR 和手动验证保留最新运行，版本 tag 不取消正在运行的验证并按同一 tag 串行。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

# 默认令牌只读；需要写入 GHCR 或创建 Release 的 job 单独声明最小权限。
permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: yqghlx/equipsense

jobs:
  # ============================================================================
  # 密钥泄露扫描（Gitleaks）— 安全门禁，发现泄露即阻断
  # 作用：防止私钥、API Key、密码等被意外提交到仓库
  # ============================================================================
  secret-scan:
    name: 密钥泄露扫描
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Gitleaks 需要完整 git 历史才能扫描所有提交
          fetch-depth: 0

      - name: Gitleaks 扫描
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # 使用免费开源探测规则，无需配置 GitHub Secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # ============================================================================
  # 后端构建 + 测试
  # ============================================================================
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    # 密钥泄露必须先通过，再跑构建（避免在含泄露的代码上浪费资源）
    needs: secret-scan

    services:
      rabbitmq:
        image: rabbitmq:4.3.4-management-alpine@sha256:44bf7eb50fe1765885659e49ccfdc775f8e531964d979321aee380a071f49f94
        env:
          RABBITMQ_DEFAULT_USER: equipai_test
          RABBITMQ_DEFAULT_PASS: equipai_test_password
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 运行生产脚本回归测试
        run: bash tests/scripts/production-scripts-test.sh

      - name: 校验 Prometheus 证书告警规则语义
        run: |
          docker run --rm \
            -v "$PWD/docker/prometheus/rules.yml:/tmp/rules.yml:ro" \
            -v "$PWD/tests/prometheus/certificate-rules.test.yml:/tmp/certificate-rules.test.yml:ro" \
            --entrypoint promtool \
            prom/prometheus:latest@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac \
            test rules /tmp/certificate-rules.test.yml

      - name: 设置 .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原依赖
        run: dotnet restore EquipAI.sln

      - name: 构建后端
        run: dotnet build EquipAI.sln --configuration Release --no-restore -m:1 --disable-build-servers

      - name: 安装 ReportGenerator（合并覆盖率报告）
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11

      # 单元测试 + 集成测试分别采集覆盖率（Cobertura 格式），随后合并门禁。
      # 阈值不在 coverlet 声明（--collect 模式不生效），由 scripts/check-coverage.mjs
      # 按程序集分级门禁（Core 80% / Application 78% / WebAPI 50% / Edge 28%，
      # Infrastructure 与 Simulator 豁免 — 见脚本头注释）
      - name: 运行单元测试（采集覆盖率）
        run: dotnet test tests/EquipAI.Tests.Unit/EquipAI.Tests.Unit.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" -s tests/coverage.runsettings --results-directory ./coverage-results

      - name: 运行 OPC UA/Modbus 协议验收
        run: bash tests/e2e/run-protocol-integration.sh

      - name: 配置并验证 RabbitMQ v2 可靠死信策略
        run: |
          # 服务容器以 digest 引用启动，--filter ancestor 匹配不到（ancestor 按本地
          # 镜像名比对）；GitHub Actions 的服务容器名即 service key，按 name 过滤。
          container_id=$(docker ps --filter name=rabbitmq --format '{{.ID}}' | head -n 1)
          test -n "$container_id"
          for i in $(seq 1 30); do
            docker exec "$container_id" rabbitmqctl await_startup --quiet 2>/dev/null && break || sleep 2
          done
          if ! docker exec "$container_id" rabbitmqctl list_vhosts --silent | grep -Fqx '/equipai_test'; then
            docker exec "$container_id" rabbitmqctl add_vhost /equipai_test
          fi
          docker exec "$container_id" rabbitmqctl set_permissions -p /equipai_test equipai_test '.*' '.*' '.*'
          docker exec "$container_id" rabbitmqctl set_policy -p /equipai_test --priority 20 --apply-to queues \
            equipai-v2-at-least-once-dlx '^equipai\.v2\.' \
            '{"dead-letter-strategy":"at-least-once","overflow":"reject-publish"}'
          policies=$(docker exec "$container_id" rabbitmqctl list_policies -p /equipai_test --formatter json)
          [[ "$policies" == *'equipai-v2-at-least-once-dlx'* ]]
          [[ "$policies" == *'at-least-once'* ]]
          [[ "$policies" == *'reject-publish'* ]]

      - name: 验证 RabbitMQ Compose 启动编排
        run: bash scripts/check-rabbitmq-startup.sh

      - name: 运行集成测试（采集覆盖率）
        run: dotnet test tests/EquipAI.Tests.Integration/EquipAI.Tests.Integration.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" -s tests/coverage.runsettings --results-directory ./coverage-results
        env:
          RUN_RABBITMQ_INTEGRATION_TESTS: 'true'
          RABBITMQ_TEST_HOST: 127.0.0.1
          RABBITMQ_TEST_PORT: '5672'
          RABBITMQ_TEST_USERNAME: equipai_test
          RABBITMQ_TEST_PASSWORD: equipai_test_password
          RABBITMQ_TEST_VHOST: /equipai_test
          RABBITMQ_TEST_MANAGEMENT_PORT: '15672'

      # 合并单元 + 集成覆盖率为单份 Cobertura XML，供门禁脚本读取
      - name: 合并覆盖率报告
        run: |
          reportgenerator \
            -reports:"coverage-results/*/coverage.cobertura.xml" \
            -targetdir:"coverage-merged" \
            -reporttypes:"Cobertura;TextSummary"

      # 覆盖率门禁：按程序集断言下限，低于阈值 → CI 红
      - name: 覆盖率门禁检查
        run: node scripts/check-coverage.mjs coverage-merged/Cobertura.xml

      # 覆盖率报告留档（HTML + Cobertura XML），便于跨版本对比回归
      - name: 生成 HTML 覆盖率报告
        run: |
          reportgenerator \
            -reports:"coverage-merged/Cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html"

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-report
          path: |
            coverage-report/
            coverage-merged/
          retention-days: 14

      # NuGet 包漏洞检查 — 发现已知 CVE 即阻断 CI
      # 若确需暂缓修复某 CVE，在 nuget 包配置中显式忽略，而非关闭门禁
      - name: 检查 NuGet 依赖漏洞（阻断）
        run: dotnet list EquipAI.sln package --vulnerable --include-transitive

  # ============================================================================
  # 备份恢复实演 — 在隔离临时项目中验证数据库和工单附件能够真实恢复
  # ============================================================================
  backup-restore-rehearsal:
    name: 备份恢复实演
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 执行隔离备份恢复实演
        run: bash tests/backup-restore-rehearsal.sh

  # ============================================================================
  # 前端构建 + 测试
  # ============================================================================
  frontend:
    name: 前端测试
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc -p tsconfig.json --noEmit

      - name: i18n 键覆盖检查
        run: npm run check:i18n

      - name: Lint 检查
        run: npx eslint src/ --max-warnings 1

      - name: 运行单元测试（采集覆盖率 + 阈值门禁）
        run: npx vitest run --coverage
        # vitest.config.ts 配置 thresholds: lines 80% / functions 80%（ratchet 棘轮下限）
        # 低于阈值 → vitest 退出码非零 → CI 红

      - name: 上传前端覆盖率报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: 构建前端
        run: npm run build

      # 前端依赖漏洞检查 — 发现未登记的 high/critical 即阻断。
      # 脚本只对已核实的 React Router RSC-only 公告保留精确例外。
      - name: npm 生产依赖审计
        run: node scripts/check-production-audit.mjs

      # 构建期开发依赖也会进入 CI/镜像构建环境；已通过 overrides 锁定传递依赖修复版本，
      # 全量审计同样阻断 high/critical，防止只审计运行时依赖而遗漏供应链风险。
      - name: npm 全量依赖审计
        run: npm audit --audit-level=high

  # ============================================================================
  # Docker 镜像构建 + 推送（main 分支推送，打 sha + latest 标签）
  # 版本 tag 发布见下方 release job（打 semver 标签）
  # ============================================================================
  docker:
    name: Docker 构建与推送
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # latest 属于可消费发布标签，必须等待本次 main 推送的全部质量门禁成功。
    needs: [backend, frontend, production-smoke, backup-restore-rehearsal, load-test, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 提取短 SHA（Trivy 扫描引用需要，metadata-action 不暴露 sha 输出）
      - name: 提取短 SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # 用 docker/metadata-action 从 git ref 推导标签，替代手写 sha 提取
      # main 分支 → 标签 sha-<short>, latest
      - name: 提取镜像标签（后端）
        id: meta-backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 提取镜像标签（前端）
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 提取镜像标签（边缘网关）
        id: meta-edgegateway
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/edgegateway
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 先加载到 runner 本地供 Trivy 扫描；任何镜像未通过前都不能写入 GHCR。
      - name: 构建并加载待扫描后端镜像
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile.backend
          load: true
          tags: ${{ steps.meta-backend.outputs.tags }}

      - name: 构建并加载待扫描前端镜像
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          load: true
          tags: ${{ steps.meta-frontend.outputs.tags }}

      - name: 构建并加载待扫描边缘网关镜像
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile.edgegateway
          load: true
          tags: ${{ steps.meta-edgegateway.outputs.tags }}

      # ========================================================
      # 安全扫描：Trivy 扫描镜像已知漏洞（CVE）— HIGH/CRITICAL 阻断
      # ========================================================
      - name: Trivy 扫描后端镜像
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:sha-${{ steps.sha.outputs.short }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Trivy 扫描前端镜像
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:sha-${{ steps.sha.outputs.short }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Trivy 扫描边缘网关镜像
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/edgegateway:sha-${{ steps.sha.outputs.short }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # 三张本地镜像全部通过后，逐标签推送刚才扫描的本地镜像，避免第二次 Buildx 引入未扫描制品。
      - name: 发布已扫描的后端镜像
        env:
          IMAGE_TAGS: ${{ steps.meta-backend.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [[ -n "$image_tag" ]] || continue
            docker image push "$image_tag"
          done <<< "$IMAGE_TAGS"

      - name: 发布已扫描的前端镜像
        env:
          IMAGE_TAGS: ${{ steps.meta-frontend.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [[ -n "$image_tag" ]] || continue
            docker image push "$image_tag"
          done <<< "$IMAGE_TAGS"

      - name: 发布已扫描的边缘网关镜像
        env:
          IMAGE_TAGS: ${{ steps.meta-edgegateway.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [[ -n "$image_tag" ]] || continue
            docker image push "$image_tag"
          done <<< "$IMAGE_TAGS"

  # ============================================================================
  # Production 容器运行时 smoke（PR、main 和版本 tag 均执行）
  # 使用当前提交实际构建的镜像 + Production 配置，验证迁移、健康探针、边缘网关、TLS 和 Nginx 代理。
  # main/tag 额外在同一隔离容器生命周期内执行完整业务 E2E；PR 保留快速 smoke，避免重复消耗浏览器资源。
  # ============================================================================
  production-smoke:
    name: Production 容器运行时 Smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 构建 smoke 后端镜像
        run: docker build --file docker/Dockerfile.backend --tag equipsense/backend:ci-${GITHUB_SHA} .

      - name: 构建 smoke 前端镜像
        run: docker build --file docker/Dockerfile.frontend --tag equipsense/frontend:ci-${GITHUB_SHA} .

      - name: 构建 smoke 边缘网关镜像
        run: docker build --file docker/Dockerfile.edgegateway --tag equipsense/edgegateway:ci-${GITHUB_SHA} .

      - name: 安装生产镜像 E2E 依赖（main/tag）
        if: github.event_name != 'pull_request'
        working-directory: frontend
        run: npm ci

      - name: 安装生产镜像 E2E 浏览器（main/tag）
        if: github.event_name != 'pull_request'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 运行 Production 容器 smoke
        env:
          SMOKE_BACKEND_IMAGE: equipsense/backend:ci-${{ github.sha }}
          SMOKE_FRONTEND_IMAGE: equipsense/frontend:ci-${{ github.sha }}
          SMOKE_EDGEGATEWAY_IMAGE: equipsense/edgegateway:ci-${{ github.sha }}
          SMOKE_RUN_E2E: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          SMOKE_ACCEPTANCE_OUTPUT_DIR: ${{ github.workspace }}/production-acceptance-report
          SMOKE_ACCEPTANCE_EXPECTED_TAG: ci-${{ github.sha }}
          # 有正式测试许可证时注入；未注入时仅验证配置路径和容器启动契约，不代表许可证有效性。
          SMOKE_AUTOMAPPER_LICENSE_KEY: ${{ secrets.AUTOMAPPER_LICENSE_KEY }}
        run: bash tests/scripts/production-runtime-smoke.sh

      - name: 上传统一生产验收报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-acceptance-report
          path: production-acceptance-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: 上传 Production 镜像 E2E 报告
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-playwright-report
          path: frontend/e2e-comprehensive/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ============================================================================
  # 版本发布（仅在打 vX.Y.Z tag 时触发）
  # 测试已在 main 分支跑过，tag 流水线只做镜像发布：打 semver 标签 1.2.3 / 1.2 / 1 + latest
  # 这样可区分版本（不再只有 :latest/:sha），支持回滚到精确版本
  # ============================================================================
  release:
    name: 版本发布（semver 标签）
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # 即使 tag 推送绕过了 main 分支，也必须先通过完整后端/前端/恢复质量门禁。
    needs: [backend, frontend, production-smoke, backup-restore-rehearsal, load-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 从 git tag 推导语义化标签：v1.2.3 → 1.2.3, 1.2, 1, latest
      - name: 提取镜像标签（后端）
        id: meta-backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: 提取镜像标签（前端）
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: 提取镜像标签（边缘网关）
        id: meta-edgegateway
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/edgegateway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 版本标签同样先在本地扫描，避免失败版本或 latest 提前进入 GHCR。
      - name: 构建并加载待扫描后端镜像
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile.backend
          load: true
          tags: ${{ steps.meta-backend.outputs.tags }}

      - name: 构建并加载待扫描前端镜像
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          load: true
          tags: ${{ steps.meta-frontend.outputs.tags }}

      - name: 构建并加载待扫描边缘网关镜像
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile.edgegateway
          load: true
          tags: ${{ steps.meta-edgegateway.outputs.tags }}

      # 发布版本也跑 Trivy 扫描，避免发布已知漏洞镜像
      - name: Trivy 扫描后端镜像
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.meta-backend.outputs.version }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Trivy 扫描前端镜像
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta-frontend.outputs.version }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Trivy 扫描边缘网关镜像
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/edgegateway:${{ steps.meta-edgegateway.outputs.version }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # 所有版本镜像通过扫描后，逐标签推送刚才构建并扫描的本地镜像。
      - name: 发布已扫描的后端版本镜像
        env:
          IMAGE_TAGS: ${{ steps.meta-backend.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [[ -n "$image_tag" ]] || continue
            docker image push "$image_tag"
          done <<< "$IMAGE_TAGS"

      - name: 发布已扫描的前端版本镜像
        env:
          IMAGE_TAGS: ${{ steps.meta-frontend.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [[ -n "$image_tag" ]] || continue
            docker image push "$image_tag"
          done <<< "$IMAGE_TAGS"

      - name: 发布已扫描的边缘网关版本镜像
        env:
          IMAGE_TAGS: ${{ steps.meta-edgegateway.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [[ -n "$image_tag" ]] || continue
            docker image push "$image_tag"
          done <<< "$IMAGE_TAGS"

  # GitHub Release 使用独立的最小仓库内容写权限，避免把仓库写权限授予镜像发布步骤。
  create-release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    permissions:
      contents: write
    steps:
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ============================================================================
  # CD 自动部署（仅在打 vX.Y.Z tag 且配置了部署密钥时触发）
  # 镜像发布（release job）成功后，SSH 到生产服务器拉取新镜像并重启
  # 采用三重健康门禁：重启后验证 backend readiness、edgegateway health 与 frontend health，失败则回滚并复验
  #
  # 必需 Secrets（在仓库 Settings → Secrets 配置）：
  #   DEPLOY_SSH_KEY    — 生产服务器 SSH 私钥（建议独立部署用户，仅授权 docker 命令）
  #   DEPLOY_HOST       — 生产服务器地址（如 deploy.example.com 或 IP）
  #   DEPLOY_USER       — SSH 用户名
  #   DEPLOY_PATH       — 服务器上生产 Docker 文件目录（必须包含 .env、validate-env.sh、
  #                       deploy-production.sh 和两个 Compose 文件，如 /opt/equipsense/docker）
  #
  # GHCR 拉取凭证（保留在服务器，不通过 CI 传输）：
  #   生产服务器需预配置环境变量 GHCR_PULL_USER / GHCR_PULL_TOKEN（read:packages 权限），
  #   放在部署用户的 ~/.bashrc 或 /etc/equipsense/deploy.env，由 SSH 会话继承。
  #
  # 可选 Secrets：
  #   DEPLOY_PORT       — SSH 端口（默认 22）
  #
  # 若未配置 DEPLOY_SSH_KEY，本 job 自动跳过（不阻断发布流程），方便 fork 仓库无需部署。
  # ============================================================================
  deploy:
    name: CD 自动部署
    runs-on: ubuntu-latest
    # job 级 if 不能引用 secrets/env 上下文；密钥是否配置改由首个 step 判定并跳过后续步骤。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, create-release]
    environment: production  # 可配合 Environment Protection Rules（人工审批 / 分支限制）
    steps:
      - name: 提取版本号与部署密钥门禁
        id: ver
        env:
          DEPLOY_SSH_KEY_SET: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "deploy_enabled=$DEPLOY_SSH_KEY_SET" >> "$GITHUB_OUTPUT"

      # SSH 到生产服务器后调用仓库内经过行为测试的部署脚本。
      # 脚本负责预检、镜像拉取、滚动重启、三重健康门禁及失败回滚验证。
      - name: SSH 部署（拉取镜像 + 重启 + 健康检查 + 失败回滚）
        if: steps.ver.outputs.deploy_enabled == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        # envs 把这里的 step 级环境变量转发到远端脚本进程，避免把 secrets 直接内插进脚本文本。
        env:
          TARGET_VERSION: ${{ steps.ver.outputs.version }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          envs: TARGET_VERSION,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            test -f ./deploy-production.sh || {
              echo "❌ DEPLOY_PATH 缺少 deploy-production.sh" >&2
              exit 1
            }
            bash ./deploy-production.sh "$TARGET_VERSION"

  # ============================================================================
  # K6 性能回归测试（main 分支 + PR）
  # 启动后端 + PG/Redis，覆盖读路径和固定种子设备的轻量遥测写路径。
  # 阈值内建在脚本里，超过阈值 k6 退出码非零 → CI 红，防止性能退化被合并。
  # 这里是稳定的回归门禁，不等同于生产容量基线；完整容量测试仍按预算手工执行。
  # ============================================================================
  load-test:
    name: K6 性能回归
    runs-on: ubuntu-latest
    # tag 可能不来自已验证的 main；版本发布也必须重新执行性能回归。
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    needs: [backend]  # 仅依赖后端测试（不需要前端构建）

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16@sha256:87f39af0a38cb42e4add367d9dfad2087a53fe5c9b24b5bc0dc66bd204b0665f
        env:
          POSTGRES_PASSWORD: test_pw
          POSTGRES_DB: equipai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 设置 .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 安装 k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: 还原并构建后端
        run: |
          dotnet restore EquipAI.sln
          dotnet build EquipAI.sln --configuration Release --no-restore -m:1 --disable-build-servers

      - name: 生成性能测试临时凭据
        run: echo "LOADTEST_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: 启动后端服务
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:8080
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=equipai_test;Username=postgres;Password=test_pw"
          Redis__ConnectionString: "localhost:6379"
          Jwt__Secret: "loadtest-secret-key-that-is-at-least-32-characters-long!!"
          DISABLE_RATE_LIMITING: "true"
        run: |
          SEED_ADMIN_PASSWORD="$LOADTEST_PASSWORD" dotnet run --project src/EquipAI.WebAPI --no-build --configuration Release &
          bash scripts/wait-for-http.sh "http://localhost:8080/health" 45 2 "后端服务"

      # 种子用户一律 MustChangePassword=true，业务 API 对其返回 403；
      # 压测前先登录一次并把密码换成压测专用随机密码，后续 k6 用新密码。
      - name: 解除压测账户强制改密
        run: |
          K6_PASSWORD="K6-$(openssl rand -hex 16)"
          token=$(curl -sf -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$LOADTEST_PASSWORD\"}" | jq -r '.accessToken')
          test -n "$token" && test "$token" != "null"
          curl -sf -X POST http://localhost:8080/api/v1/auth/change-password \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"currentPassword\":\"$LOADTEST_PASSWORD\",\"newPassword\":\"$K6_PASSWORD\"}" > /dev/null
          echo "K6_PASSWORD=$K6_PASSWORD" >> "$GITHUB_ENV"

      - name: 检查压测工具凭据卫生
        run: |
          if rg -n --glob '*.js' --glob '*.sh' 'Admin@123|device123' tests/load tests/stress; then
            echo "压测/混沌工具不得内置公开默认凭据"
            exit 1
          fi

      # 读路径压测：20 VU × 30s（CI 轻量，P95<500ms、错误率<1%）
      - name: K6 API 读取压测（读路径回归）
        working-directory: tests/load
        env:
          BASE_URL: http://localhost:8080
          VUS: '20'
        run: k6 run --quiet -e AUTH_USER=admin -e AUTH_PASS="$K6_PASSWORD" api-read.js

      # 导出性能指标为 JSON，上传为 artifact 便于跨版本对比回归
      - name: K6 API 读取压测（导出 JSON 指标）
        working-directory: tests/load
        env:
          BASE_URL: http://localhost:8080
          VUS: '20'
        run: k6 run --quiet -e AUTH_USER=admin -e AUTH_PASS="$K6_PASSWORD" --out json=api-read-results.json api-read.js
        # 第二次跑用于留档，不阻断（首次已验证阈值）
        continue-on-error: true

      # 写路径压测：20 VU × 30s，使用 DataSeeder 固定的 AC-001 设备，覆盖
      # 设备编码解析、请求校验、异步遥测队列和数据库批量写入链路。
      - name: K6 遥测写入压测（写路径回归）
        working-directory: tests/load
        env:
          BASE_URL: http://localhost:8080
          DEVICES: '20'
          DURATION: '30s'
        run: k6 run --quiet -e AUTH_USER=admin -e AUTH_PASS="$K6_PASSWORD" -e DEVICES="$DEVICES" -e DURATION="$DURATION" --out json=telemetry-write-results.json telemetry-write.js

      - name: 上传 K6 性能报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k6-performance-report
          path: |
            tests/load/api-read-results.json
            tests/load/telemetry-write-results.json
          retention-days: 14
          if-no-files-found: ignore

  # ============================================================================
  # E2E 测试（仅 main 分支，CI 内启动前后端）
  # ============================================================================
  e2e:
    name: E2E 测试
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'pull_request'
    needs: [backend, frontend]

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16@sha256:87f39af0a38cb42e4add367d9dfad2087a53fe5c9b24b5bc0dc66bd204b0665f
        env:
          POSTGRES_PASSWORD: test_pw
          POSTGRES_DB: equipai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 设置 .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 还原并构建后端
        run: |
          dotnet restore EquipAI.sln
          dotnet build EquipAI.sln --configuration Release --no-restore -m:1 --disable-build-servers

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 启动后端服务
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:8080
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=equipai_test;Username=postgres;Password=test_pw"
          Redis__ConnectionString: "localhost:6379"
          Jwt__Secret: "e2e-test-secret-key-that-is-at-least-32-characters-long!!"
          DISABLE_RATE_LIMITING: "true"
          # E2E 负向用例故意输错密码；不关锁定会 5 次失败锁 admin 15 分钟，
          # 污染后续所有用例（生产环境该开关无效，锁定恒启用）。
          Auth__DisableAccountLockout: "true"
          # E2E 跨租户隔离测试（permission-denied.spec.ts）依赖第二租户账户
          SEED_TENANT2_ACCOUNT: "true"
          # 全套件会创建远超默认 50 台的设备；配额耗尽后 POST /devices 全部被拒。
          SEED_MAX_DEVICES: "100000"
        run: |
          dotnet run --project src/EquipAI.WebAPI --no-build --configuration Release &
          # 等待后端健康检查通过（最多约 90 秒），超时必须阻断后续 E2E。
          bash scripts/wait-for-http.sh "http://localhost:8080/health" 45 2 "后端服务"

      - name: 启动前端开发服务器
        working-directory: frontend
        run: |
          npx vite --host 0.0.0.0 --port 5173 &
          # 等待前端服务就绪（最多约 30 秒），超时必须阻断后续 E2E。
          bash ../scripts/wait-for-http.sh "http://localhost:5173" 15 2 "前端服务"

      - name: 运行 E2E 测试
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          CI: true
          # 启用 API 快速登录路径（loginAsFast）：跳过 UI 表单填写，
          # 用 API 登录 + addInitScript 注入 sessionStorage。带 UI 兜底，失败自动降级。
          # 154 次 beforeEach 登录可节省约 10 分钟（每次 ~5s → ~0.5s）。
          E2E_FAST_LOGIN: '1'
        run: npx playwright test e2e-comprehensive --reporter=list

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/e2e-comprehensive/test-results/
          retention-days: 7
