# EquipSense CI/CD 流水线
name: CI/CD

on:
  # push 触发：主/开发分支（路径过滤）+ 版本 tag（打镜像 semver 标签）
  # paths-ignore 仅作用于分支推送，tag 推送不带文件路径故自动忽略
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'output/**'
      - 'coverage-results/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'output/**'
      - 'coverage-results/**'
  workflow_dispatch:  # 保留手动触发能力（紧急验证 / 选择性重跑）

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: yqghlx/equipsense

jobs:
  # ============================================================================
  # 密钥泄露扫描（Gitleaks）— 安全门禁，发现泄露即阻断
  # 作用：防止私钥、API Key、密码等被意外提交到仓库
  # ============================================================================
  secret-scan:
    name: 密钥泄露扫描
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks 需要完整 git 历史才能扫描所有提交
          fetch-depth: 0

      - name: Gitleaks 扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          # 使用免费开源探测规则，无需配置 GitHub Secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # ============================================================================
  # 后端构建 + 测试
  # ============================================================================
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    # 密钥泄露必须先通过，再跑构建（避免在含泄露的代码上浪费资源）
    needs: secret-scan

    services:
      rabbitmq:
        image: rabbitmq:4.3.4-management-alpine@sha256:44bf7eb50fe1765885659e49ccfdc775f8e531964d979321aee380a071f49f94
        env:
          RABBITMQ_DEFAULT_USER: equipai_test
          RABBITMQ_DEFAULT_PASS: equipai_test_password
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: 运行生产脚本回归测试
        run: bash tests/scripts/production-scripts-test.sh

      - name: 设置 .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原依赖
        run: dotnet restore EquipAI.sln

      - name: 构建后端
        run: dotnet build EquipAI.sln --configuration Release --no-restore

      - name: 安装 ReportGenerator（合并覆盖率报告）
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11

      # 单元测试 + 集成测试分别采集覆盖率（Cobertura 格式），随后合并门禁。
      # 阈值不在 coverlet 声明（--collect 模式不生效），由 scripts/check-coverage.mjs
      # 按程序集分级门禁（Core 80% / Application 78% / WebAPI 50% / Edge 28%，
      # Infrastructure 与 Simulator 豁免 — 见脚本头注释）
      - name: 运行单元测试（采集覆盖率）
        run: dotnet test tests/EquipAI.Tests.Unit/EquipAI.Tests.Unit.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" -s tests/coverage.runsettings --results-directory ./coverage-results

      - name: 配置并验证 RabbitMQ v2 可靠死信策略
        run: |
          container_id=$(docker ps --filter ancestor=rabbitmq:4.3.4-management-alpine --format '{{.ID}}' | head -n 1)
          test -n "$container_id"
          docker exec "$container_id" rabbitmqctl set_policy -p / --priority 20 --apply-to queues \
            equipai-v2-at-least-once-dlx '^equipai\.v2\.' \
            '{"dead-letter-strategy":"at-least-once","overflow":"reject-publish"}'
          policies=$(docker exec "$container_id" rabbitmqctl list_policies -p / --formatter json)
          [[ "$policies" == *'equipai-v2-at-least-once-dlx'* ]]
          [[ "$policies" == *'at-least-once'* ]]
          [[ "$policies" == *'reject-publish'* ]]

      - name: 验证 RabbitMQ Compose 启动编排
        run: bash scripts/check-rabbitmq-startup.sh

      - name: 运行集成测试（采集覆盖率）
        run: dotnet test tests/EquipAI.Tests.Integration/EquipAI.Tests.Integration.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" -s tests/coverage.runsettings --results-directory ./coverage-results
        env:
          RUN_RABBITMQ_INTEGRATION_TESTS: 'true'
          RABBITMQ_TEST_HOST: 127.0.0.1
          RABBITMQ_TEST_PORT: '5672'
          RABBITMQ_TEST_USERNAME: equipai_test
          RABBITMQ_TEST_PASSWORD: equipai_test_password
          RABBITMQ_TEST_MANAGEMENT_PORT: '15672'

      # 合并单元 + 集成覆盖率为单份 Cobertura XML，供门禁脚本读取
      - name: 合并覆盖率报告
        run: |
          reportgenerator \
            -reports:"coverage-results/*/coverage.cobertura.xml" \
            -targetdir:"coverage-merged" \
            -reporttypes:"Cobertura;TextSummary"

      # 覆盖率门禁：按程序集断言下限，低于阈值 → CI 红
      - name: 覆盖率门禁检查
        run: node scripts/check-coverage.mjs coverage-merged/Cobertura.xml

      # 覆盖率报告留档（HTML + Cobertura XML），便于跨版本对比回归
      - name: 生成 HTML 覆盖率报告
        run: |
          reportgenerator \
            -reports:"coverage-merged/Cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html"

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            coverage-report/
            coverage-merged/
          retention-days: 14

      # NuGet 包漏洞检查 — 发现已知 CVE 即阻断 CI
      # 若确需暂缓修复某 CVE，在 nuget 包配置中显式忽略，而非关闭门禁
      - name: 检查 NuGet 依赖漏洞（阻断）
        run: dotnet list EquipAI.sln package --vulnerable --include-transitive

  # ============================================================================
  # 前端构建 + 测试
  # ============================================================================
  frontend:
    name: 前端测试
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc -p tsconfig.json --noEmit

      - name: i18n 键覆盖检查
        run: npm run check:i18n

      - name: Lint 检查
        run: npx eslint src/ --max-warnings 1

      - name: 运行单元测试（采集覆盖率 + 阈值门禁）
        run: npx vitest run --coverage
        # vitest.config.ts 配置 thresholds: lines 80% / functions 80%（ratchet 棘轮下限）
        # 低于阈值 → vitest 退出码非零 → CI 红

      - name: 上传前端覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: 构建前端
        run: npm run build

      # 前端依赖漏洞检查 — 发现未登记的 high/critical 即阻断。
      # 脚本只对已核实的 React Router RSC-only 公告保留精确例外。
      - name: npm 生产依赖审计
        run: node scripts/check-production-audit.mjs

      # 构建期开发依赖也会进入 CI/镜像构建环境；已通过 overrides 锁定传递依赖修复版本，
      # 全量审计同样阻断 high/critical，防止只审计运行时依赖而遗漏供应链风险。
      - name: npm 全量依赖审计
        run: npm audit --audit-level=high

  # ============================================================================
  # Docker 镜像构建 + 推送（main 分支推送，打 sha + latest 标签）
  # 版本 tag 发布见下方 release job（打 semver 标签）
  # ============================================================================
  docker:
    name: Docker 构建与推送
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 提取短 SHA（Trivy 扫描引用需要，metadata-action 不暴露 sha 输出）
      - name: 提取短 SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # 用 docker/metadata-action 从 git ref 推导标签，替代手写 sha 提取
      # main 分支 → 标签 sha-<short>, latest
      - name: 提取镜像标签（后端）
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 提取镜像标签（前端）
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}

      # ========================================================
      # 安全扫描：Trivy 扫描镜像已知漏洞（CVE）— HIGH/CRITICAL 阻断
      # ========================================================
      - name: Trivy 扫描后端镜像
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:sha-${{ steps.sha.outputs.short }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Trivy 扫描前端镜像
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:sha-${{ steps.sha.outputs.short }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # ============================================================================
  # 版本发布（仅在打 vX.Y.Z tag 时触发）
  # 测试已在 main 分支跑过，tag 流水线只做镜像发布：打 semver 标签 1.2.3 / 1.2 / 1 + latest
  # 这样可区分版本（不再只有 :latest/:sha），支持回滚到精确版本
  # ============================================================================
  release:
    name: 版本发布（semver 标签）
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # 即使 tag 推送绕过了 main 分支，也必须先通过完整后端/前端质量门禁。
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 从 git tag 推导语义化标签：v1.2.3 → 1.2.3, 1.2, 1, latest
      - name: 提取镜像标签（后端）
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: 提取镜像标签（前端）
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}

      # 发布版本也跑 Trivy 扫描，避免发布已知漏洞镜像
      - name: Trivy 扫描后端镜像
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.meta-backend.outputs.version }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Trivy 扫描前端镜像
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta-frontend.outputs.version }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # 生成 GitHub Release（自动从 tag 名提取版本号，CHANGELOG.md 作为正文）
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ============================================================================
  # CD 自动部署（仅在打 vX.Y.Z tag 且配置了部署密钥时触发）
  # 镜像发布（release job）成功后，SSH 到生产服务器拉取新镜像并重启
  # 采用蓝绿式健康门禁：重启后轮询 /health，失败则回滚到上一版本
  #
  # 必需 Secrets（在仓库 Settings → Secrets 配置）：
  #   DEPLOY_SSH_KEY    — 生产服务器 SSH 私钥（建议独立部署用户，仅授权 docker 命令）
  #   DEPLOY_HOST       — 生产服务器地址（如 deploy.example.com 或 IP）
  #   DEPLOY_USER       — SSH 用户名
  #   DEPLOY_PATH       — 服务器上生产 Docker 文件目录（必须包含 .env、validate-env.sh 和两个 Compose 文件，
  #                       如 /opt/equipsense/docker）
  #
  # GHCR 拉取凭证（保留在服务器，不通过 CI 传输）：
  #   生产服务器需预配置环境变量 GHCR_PULL_USER / GHCR_PULL_TOKEN（read:packages 权限），
  #   放在部署用户的 ~/.bashrc 或 /etc/equipsense/deploy.env，由 SSH 会话继承。
  #
  # 可选 Secrets：
  #   DEPLOY_PORT       — SSH 端口（默认 22）
  #
  # 若未配置 DEPLOY_SSH_KEY，本 job 自动跳过（不阻断发布流程），方便 fork 仓库无需部署。
  # ============================================================================
  deploy:
    name: CD 自动部署
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && secrets.DEPLOY_SSH_KEY != ''
    needs: [release]
    environment: production  # 可配合 Environment Protection Rules（人工审批 / 分支限制）
    steps:
      - name: 提取版本号
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # SSH 到生产服务器：登录 GHCR → 拉取新镜像 → 滚动重启 → 健康门禁
      # 使用 docker-compose.prod.yml 覆盖（拉取 GHCR 镜像，不在服务器本地构建）
      # 失败自动回滚到上一 tag（记录在 .last-deployed-tag 文件）
      - name: SSH 部署（拉取镜像 + 重启 + 健康检查 + 失败回滚）
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          envs: TARGET_VERSION,DEPLOY_PATH
          env:
            TARGET_VERSION: ${{ steps.ver.outputs.version }}
            DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            echo "=== 部署版本 $TARGET_VERSION ==="

            # 先锁定目标版本，让生产覆盖文件可以在 preflight 阶段完成变量展开。
            export TAG="$TARGET_VERSION"

            # Compose 文件组合：base + prod 覆盖（拉取 GHCR 镜像）。
            # 显式指定 .env，避免 SSH 工作目录或 Compose 默认加载规则变化导致误用占位配置。
            COMPOSE="docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml"

            # 任何镜像操作和容器重启前先阻断不安全/不完整配置，避免把失败推迟到停机之后。
            if [ ! -f .env ] || [ ! -f validate-env.sh ]; then
              echo "❌ DEPLOY_PATH 必须包含 .env、validate-env.sh 和 Compose 文件" >&2
              exit 1
            fi
            bash ./validate-env.sh .env
            $COMPOSE config --quiet

            # 记录当前版本（用于回滚）
            CURRENT_TAG=$(cat .last-deployed-tag 2>/dev/null || echo "unknown")
            echo "当前版本: $CURRENT_TAG → 目标版本: $TARGET_VERSION"

            # 登录 GHCR 拉取私有镜像（凭证从服务器环境变量读取，不通过 CI 传输）
            if [ -z "${GHCR_PULL_TOKEN:-}" ] || [ -z "${GHCR_PULL_USER:-}" ]; then
              echo "❌ 服务器未配置 GHCR_PULL_USER/GHCR_PULL_TOKEN 环境变量" >&2
              exit 1
            fi
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USER" --password-stdin

            # 拉取新镜像 + 滚动重启（仅 backend/frontend，不动 PG/Redis/MQTT 等有状态服务）
            $COMPOSE pull backend frontend
            $COMPOSE up -d --no-deps --force-recreate backend frontend

            # 等待 30 秒让服务初始化
            echo "等待服务启动..."
            sleep 30

            # 健康门禁：同时检查后端全部依赖就绪和前端容器健康，最多轮询 120 秒。
            # /health 只覆盖 PostgreSQL/Redis 存活，不能证明 RabbitMQ、MQTT 和只读库可用。
            HEALTHY=false
            for i in $(seq 1 12); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health/ready || echo "000")
              FRONTEND_CONTAINER="$($COMPOSE ps -q frontend 2>/dev/null || true)"
              FRONTEND_STATUS=""
              if [ -n "$FRONTEND_CONTAINER" ]; then
                FRONTEND_STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$FRONTEND_CONTAINER" 2>/dev/null || true)
              fi
              if [ "$HTTP_CODE" = "200" ] && [ "$FRONTEND_STATUS" = "healthy" ]; then
                echo "✅ 后端 readiness + 前端容器健康检查通过（第 $i 次探测）"
                HEALTHY=true
                break
              fi
              echo "等待健康检查... ($i/12, backend readiness HTTP $HTTP_CODE, frontend=$FRONTEND_STATUS)"
              sleep 10
            done

            # 健康检查失败 → 回滚到上一版本
            if [ "$HEALTHY" != "true" ]; then
              if [ "$CURRENT_TAG" != "unknown" ] && [ -n "$CURRENT_TAG" ]; then
                echo "❌ 健康检查失败，回滚到 $CURRENT_TAG"
                export TAG=$CURRENT_TAG
                $COMPOSE pull backend frontend
                $COMPOSE up -d --no-deps --force-recreate backend frontend
                echo "已回滚到 $CURRENT_TAG，请检查日志排查问题"
              else
                echo "❌ 健康检查失败，且没有可用的历史版本可自动回滚；保留现场并要求人工恢复" >&2
              fi
              exit 1
            fi

            # 健康检查通过 → 更新版本记录
            echo "$TARGET_VERSION" > .last-deployed-tag
            echo "=== 部署成功: $TARGET_VERSION ==="
            $COMPOSE ps

  # ============================================================================
  # K6 性能回归测试（main 分支 + PR）
  # 启动后端 + PG/Redis，用 k6 跑 api-read.js（读路径冒烟）
  # 阈值内建在脚本里：P95 < 500ms、错误率 < 1%
  # 超过阈值 k6 退出码非零 → CI 红，防止读路径性能退化被合并
  # 注：写路径压测（telemetry-write.js）依赖预置设备数据，CI 无可靠种子，
  #     保留本地/手动跑（见 tests/load/PERF_BASELINE.md）
  # ============================================================================
  load-test:
    name: K6 性能回归
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'pull_request'
    needs: [backend]  # 仅依赖后端测试（不需要前端构建）

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16@sha256:87f39af0a38cb42e4add367d9dfad2087a53fe5c9b24b5bc0dc66bd204b0665f
        env:
          POSTGRES_PASSWORD: test_pw
          POSTGRES_DB: equipai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: 设置 .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 安装 k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: 还原并构建后端
        run: |
          dotnet restore EquipAI.sln
          dotnet build EquipAI.sln --configuration Release --no-restore

      - name: 生成性能测试临时凭据
        run: echo "LOADTEST_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: 启动后端服务
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:8080
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=equipai_test;Username=postgres;Password=test_pw"
          Redis__ConnectionString: "localhost:6379"
          Jwt__Secret: "loadtest-secret-key-that-is-at-least-32-characters-long!!"
          DISABLE_RATE_LIMITING: "true"
        run: |
          SEED_ADMIN_PASSWORD="$LOADTEST_PASSWORD" dotnet run --project src/EquipAI.WebAPI --no-build --configuration Release &
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "后端服务已启动"
              break
            fi
            echo "等待后端启动... ($i/45)"
            sleep 2
          done

      - name: 检查压测工具凭据卫生
        run: |
          if rg -n --glob '*.js' --glob '*.sh' 'Admin@123|device123' tests/load tests/stress; then
            echo "压测/混沌工具不得内置公开默认凭据"
            exit 1
          fi

      # 读路径压测：20 VU × 30s（CI 轻量，P95<500ms、错误率<1%）
      - name: K6 API 读取压测（读路径回归）
        working-directory: tests/load
        env:
          BASE_URL: http://localhost:8080
          VUS: '20'
        run: k6 run --quiet -e AUTH_USER=admin -e AUTH_PASS="$LOADTEST_PASSWORD" api-read.js

      # 导出性能指标为 JSON，上传为 artifact 便于跨版本对比回归
      - name: K6 API 读取压测（导出 JSON 指标）
        working-directory: tests/load
        env:
          BASE_URL: http://localhost:8080
          VUS: '20'
        run: k6 run --quiet -e AUTH_USER=admin -e AUTH_PASS="$LOADTEST_PASSWORD" --out json=api-read-results.json api-read.js
        # 第二次跑用于留档，不阻断（首次已验证阈值）
        continue-on-error: true

      - name: 上传 K6 性能报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-report
          path: tests/load/api-read-results.json
          retention-days: 14
          if-no-files-found: ignore

  # ============================================================================
  # E2E 测试（仅 main 分支，CI 内启动前后端）
  # ============================================================================
  e2e:
    name: E2E 测试
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'pull_request'
    needs: [backend, frontend]

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16@sha256:87f39af0a38cb42e4add367d9dfad2087a53fe5c9b24b5bc0dc66bd204b0665f
        env:
          POSTGRES_PASSWORD: test_pw
          POSTGRES_DB: equipai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: 设置 .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 还原并构建后端
        run: |
          dotnet restore EquipAI.sln
          dotnet build EquipAI.sln --configuration Release --no-restore

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 启动后端服务
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:8080
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=equipai_test;Username=postgres;Password=test_pw"
          Redis__ConnectionString: "localhost:6379"
          Jwt__Secret: "e2e-test-secret-key-that-is-at-least-32-characters-long!!"
          DISABLE_RATE_LIMITING: "true"
          # E2E 跨租户隔离测试（permission-denied.spec.ts）依赖第二租户账户
          SEED_TENANT2_ACCOUNT: "true"
        run: |
          dotnet run --project src/EquipAI.WebAPI --no-build --configuration Release &
          # 等待后端健康检查通过（最多 90 秒）
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "后端服务已启动"
              break
            fi
            echo "等待后端启动... ($i/45)"
            sleep 2
          done

      - name: 启动前端开发服务器
        working-directory: frontend
        run: |
          npx vite --host 0.0.0.0 --port 5173 &
          # 等待前端服务就绪（最多 30 秒）
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "前端服务已启动"
              break
            fi
            echo "等待前端启动... ($i/15)"
            sleep 2
          done

      - name: 运行 E2E 测试
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          CI: true
          # 启用 API 快速登录路径（loginAsFast）：跳过 UI 表单填写，
          # 用 API 登录 + addInitScript 注入 sessionStorage。带 UI 兜底，失败自动降级。
          # 154 次 beforeEach 登录可节省约 10 分钟（每次 ~5s → ~0.5s）。
          E2E_FAST_LOGIN: '1'
        run: npx playwright test e2e-comprehensive --reporter=list

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e-comprehensive/test-results/
          retention-days: 7
