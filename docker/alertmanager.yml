# AlertManager 配置 — 告警路由与通知
#
# 通知策略：
# - critical: 立即发送（无需分组等待）
# - warning: 5 分钟分组聚合后发送
# - info: 仅记录不通知（供 Dashboard 查看）
#
# 通知渠道：webhook（接入钉钉/飞书/企业微信机器人）
# 生产环境通过 ALERT_WEBHOOK_URL 环境变量配置实际地址

global:
  resolve_timeout: 5m

# 告警抑制规则 — 某告警触发时抑制相关告警
inhibit_rules:
  # 后端宕机时，不再发送"分析停滞"等下游告警（根因是后端不可用）
  - source_match:
      alertname: BackendDown
    target_match_re:
      category: business|performance
    equal: ['category']

  # MQTT 断开时，抑制"遥测处理延迟"告警（根因是数据没进来）
  - source_match:
      alertname: MqttDisconnected
    target_match:
      alertname: HighTelemetryProcessingLatency

  # HTTP 错误率高时，抑制"AI 分析停滞"等业务告警（根因是 HTTP 层故障）
  - source_match:
      alertname: HighErrorRate
    target_match_re:
      alertname: AnalysisStalled|HighAnalysisLatency

route:
  # 默认分组等待时间
  group_by: ['alertname', 'category']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'webhook-default'

  routes:
    # critical 立即发送
    - match:
        severity: critical
      receiver: 'webhook-critical'
      group_wait: 0s
      repeat_interval: 1h

    # warning 5 分钟聚合
    - match:
        severity: warning
      receiver: 'webhook-warning'
      group_wait: 5m

    # info 不发送通知
    - match:
        severity: info
      receiver: 'dev-null'

receivers:
  - name: 'dev-null'

  # 默认 webhook（通过环境变量 ALERT_WEBHOOK_URL 配置）
  - name: 'webhook-default'
    webhook_configs:
      - url: 'http://localhost:5001/alert'
        send_resolved: true

  - name: 'webhook-critical'
    webhook_configs:
      - url: 'http://localhost:5001/alert-critical'
        send_resolved: true

  - name: 'webhook-warning'
    webhook_configs:
      - url: 'http://localhost:5001/alert-warning'
        send_resolved: true
