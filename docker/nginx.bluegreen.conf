# 蓝绿部署 Nginx 配置（生产路由层）
#
# 与 nginx.conf（单后端）的区别：引入 upstream 块，指向由外部脚本维护的
# /etc/nginx/conf.d/upstream-blue.conf 或 upstream-green.conf（二选一）。
# 部署脚本切换 active 颜色 → 重写 include 文件 → nginx -s reload（原子切换 <1s）。
#
# 由独立 nginx 路由容器使用（docker-compose.bluegreen.yml 的 router 服务），
# 不替换既有 frontend 容器内的 nginx（后者仅服务 SPA 静态资源）。
#
# 使用：docker run -v ./nginx.bluegreen.conf:/etc/nginx/nginx.conf \
#                   -v ./upstream-active.conf:/etc/nginx/conf.d/upstream-active.conf

# 蓝绿 upstream（由部署脚本动态切换 include 的文件内容）
# upstream-active.conf 内容示例（活跃=blue）：
#   upstream backend_active { server backend-blue:8080; }
# 切换到 green 时脚本改写为：
#   upstream backend_active { server backend-green:8080; }
# 并执行 nginx -s reload
include /etc/nginx/conf.d/upstream-active.conf;

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name _;

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务（路由层：SPA 静态 + API/Hub 反代到活跃后端）
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     ${SSL_CERT_PATH};
    ssl_certificate_key ${SSL_KEY_PATH};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # API 反代到活跃后端（蓝绿切换时此 upstream 指向变化，nginx reload 原子生效）
    location /api/ {
        proxy_pass http://backend_active;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://backend_active;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SPA 静态资源由活跃前端色提供
    location / {
        proxy_pass http://frontend_active;
        proxy_set_header Host $host;
    }

    location /assets/ {
        proxy_pass http://frontend_active;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
