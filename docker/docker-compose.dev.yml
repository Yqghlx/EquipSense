# docker/docker-compose.dev.yml
# 开发环境依赖服务：PostgreSQL + TimescaleDB, Redis, Mosquitto
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: equipai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: equipai_dev
      POSTGRES_USER: postgres
      # 开发密码通过环境变量传入，避免把可复制的凭据提交到仓库。
      POSTGRES_PASSWORD: "${DEV_PG_PASSWORD:?请在启动开发依赖前设置 DEV_PG_PASSWORD}"
    volumes:
      - pgdev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d equipai_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: equipai-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: equipai-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  # RabbitMQ：事件总线（可选，默认进程内事件总线即可运行）
  # 启用方式：.env 设 EventBus__Provider=RabbitMQ，backend 依赖此服务
  # 含 management 插件，访问 http://localhost:15672（guest/guest）查看队列/消息/死信
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: equipai-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  pgdev:
