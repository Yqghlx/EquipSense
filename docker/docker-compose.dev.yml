# docker/docker-compose.dev.yml
# 开发环境依赖服务：PostgreSQL + TimescaleDB, Redis, Mosquitto
services:
  postgres:
    image: timescale/timescaledb:latest-pg16@sha256:87f39af0a38cb42e4add367d9dfad2087a53fe5c9b24b5bc0dc66bd204b0665f
    container_name: equipai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: equipai_dev
      POSTGRES_USER: postgres
      # 开发密码通过环境变量传入，避免把可复制的凭据提交到仓库。
      POSTGRES_PASSWORD: "${DEV_PG_PASSWORD:?请在启动开发依赖前设置 DEV_PG_PASSWORD}"
    volumes:
      - pgdev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d equipai_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: equipai-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2@sha256:a908c65cc8e67ec9d292ef27c2c0360dbaaee7eb1b935cdd194e67697f15dea1
    container_name: equipai-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  # RabbitMQ：事件总线测试依赖；含 management 插件，访问 http://localhost:15672 查看队列/消息/死信。
  rabbitmq:
    image: "${RABBITMQ_IMAGE:-rabbitmq:4.3.4-management-alpine@sha256:44bf7eb50fe1765885659e49ccfdc775f8e531964d979321aee380a071f49f94}"
    container_name: equipai-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_TEST_USERNAME:-equipai_test}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_TEST_PASSWORD:-equipai_test_password}"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/start.sh:/usr/local/bin/equipai-rabbitmq-start.sh:ro
    command: ["/bin/bash", "/usr/local/bin/equipai-rabbitmq-start.sh"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  pgdev:
