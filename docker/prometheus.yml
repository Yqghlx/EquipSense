# Prometheus 配置 — 采集 EquipSense 后端指标
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 后端 ASP.NET Core 指标
  - job_name: 'equipai-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8080']
    scrape_interval: 10s

  # 边缘网关指标
  - job_name: 'equipai-edgegateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['edgegateway:8081']
    scrape_interval: 10s

  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
