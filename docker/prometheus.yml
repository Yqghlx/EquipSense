# Prometheus 配置 — 采集 EquipSense 后端指标 + 告警规则
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则文件
rule_files:
  - /etc/prometheus/rules.yml

# 告警推送到 AlertManager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # 后端 ASP.NET Core 指标
  - job_name: 'equipai-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8080']
    scrape_interval: 10s

  # 边缘网关指标
  - job_name: 'equipai-edgegateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['edgegateway:8081']
    scrape_interval: 10s

  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
