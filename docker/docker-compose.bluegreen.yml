# 蓝绿部署覆盖文件（Blue-Green Deployment）
#
# 工作原理：用 Docker Compose profiles 同时运行 backend/frontend 的两份实例（blue/green），
# 各自监听独立端口。边缘网关保持单实例，但在切换前先指向已通过健康门禁的目标后端。
# Nginx 路由层（router 服务）通过可热重载的 upstream 配置指向活跃颜色。
# 部署流程（由 scripts/deploy-bluegreen.sh 编排）：
#   1. 确定当前活跃颜色（读 .active-color 文件，默认 blue）
#   2. 在非活跃颜色上拉取新镜像 + 启动（旧颜色仍服务流量）
#   3. 健康门禁：轮询非活跃颜色的 /health
#   4. 更新边缘网关镜像和后端目标，验证网关 /health
#   5. 切换：更新 router upstream include → nginx reload（原子切换，<1s 中断）
#   6. 优雅停止旧颜色（drain 连接后停止）
#   7. 记录新活跃颜色
#
# 与 docker-compose.yml + docker-compose.prod.yml 叠加使用：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.bluegreen.yml \
#     --profile blue --profile green up -d
#
# 端口分配：backend blue 8081 / green 8082；frontend blue 3001 / green 3002；
# edgegateway 使用 18081（可由 EDGE_BLUEGREEN_PORT 覆盖）；
# router 占用 80/443（对外入口）。

services:
  # ── 后端蓝绿实例 ──────────────────────────────────────────────────
  # 通过 profile 隔离：`--profile blue` 启动 backend-blue，`--profile green` 启动 backend-green
  backend-blue:
    extends:
      file: docker-compose.yml
      service: backend
    profiles: ["blue"]
    container_name: equipai-backend-blue
    ports: !override
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8081:8080"
    # 覆盖基础服务端口，避免继承宿主 8080；router 负责对外反代。
    networks:
      - default
      - bluegreen

  backend-green:
    extends:
      file: docker-compose.yml
      service: backend
    profiles: ["green"]
    container_name: equipai-backend-green
    ports: !override
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8082:8080"
    networks:
      - default
      - bluegreen

  # ── 前端蓝绿实例 ──────────────────────────────────────────────────
  frontend-blue:
    extends:
      file: docker-compose.yml
      service: frontend
    profiles: ["blue"]
    container_name: equipai-frontend-blue
    ports: !override
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:3001:80"
    environment:
      BACKEND_URL: "http://backend-blue:8080"
    networks:
      - default
      - bluegreen

  frontend-green:
    extends:
      file: docker-compose.yml
      service: frontend
    profiles: ["green"]
    container_name: equipai-frontend-green
    ports: !override
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:3002:80"
    environment:
      BACKEND_URL: "http://backend-green:8080"
    networks:
      - default
      - bluegreen

  # ── 边缘网关（单实例，随目标后端原子更新） ────────────────────────
  # 移除基础服务对 backend 的 depends_on，避免蓝绿 profile 启动旧的 backend 服务；
  # 编排脚本会先完成目标后端健康门禁，再重建此服务。
  edgegateway:
    container_name: equipai-edgegateway
    ports: !override
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${EDGE_BLUEGREEN_PORT:-18081}:8081"
    environment:
      Gateway__BackendUrl: "${GATEWAY_BACKEND_URL:-http://backend:8080}"
    depends_on: !override []
    networks: !override
      - default
      - bluegreen

  # ── 蓝绿路由层（Nginx，原子切换入口） ────────────────────────────
  # 独立于 frontend 容器内的 nginx；router 负责把 /api/ /hubs/ / 反代到活跃色。
  # upstream 由 /etc/nginx/conf.d/upstream-active.conf 决定，部署脚本切换时重写 + reload。
  router:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: equipai-router
    profiles: ["blue", "green"]
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:443:443"
    volumes:
      - ./nginx.bluegreen.conf:/etc/nginx/nginx.conf:ro
      - ./upstream-active.conf:/etc/nginx/conf.d/upstream-active.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    # 不绑定任一颜色的 depends_on：发布过程中只会启动目标颜色，
    # 固定依赖 blue 会让 green profile 在 Compose 解析阶段直接失效。
    # 上游容器由部署脚本先完成健康门禁，router 只负责 reload 原子切流。
    networks:
      - bluegreen
    restart: unless-stopped

networks:
  bluegreen:
    name: equipsense_bluegreen
