# =============================================================================
# Grafana Dashboard 自动供给配置
# =============================================================================
# 从指定目录自动加载 JSON 格式的仪表盘配置文件。
# 放置在 dashboards/ 目录下的 .json 文件会在 Grafana 启动时自动导入。
# =============================================================================

apiVersion: 1

providers:
  - name: EquipSense
    orgId: 1
    folder: EquipSense
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
