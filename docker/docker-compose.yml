# docker/docker-compose.yml
# 生产环境：全套服务一键启动
# 使用方式：docker compose up -d
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: equipai-postgres
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${PG_DB:-equipai}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 中设置 PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-equipai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: equipai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: equipai-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: equipai-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${PG_DB:-equipai};Username=${PG_USER:-postgres};Password=${PG_PASSWORD}"
      Redis__ConnectionString: "redis:6379${REDIS_PASSWORD:+,password=${REDIS_PASSWORD}}"
      Jwt__Secret: "${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}"
      Jwt__Issuer: "EquipAI"
      Jwt__Audience: "EquipAI"
      Mqtt__Host: mosquitto
      Mqtt__Port: 1883
      Mqtt__ClientIdPrefix: "equipai-backend"
      Mqtt__TopicPattern: "factory/+/telemetry/+"
      Llm__ApiKey: "${LLM_API_KEY:-}"
      Llm__ModelId: "${LLM_MODEL:-qwen-plus}"
      Llm__Endpoint: "${LLM_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: equipai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  pgdata:
  mosquitto_data:
