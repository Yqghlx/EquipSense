# docker/docker-compose.yml
# 生产环境：全套服务一键启动
# 使用方式：docker compose up -d
services:
  postgres:
    image: timescale/timescaledb:latest-pg16@sha256:87f39af0a38cb42e4add367d9dfad2087a53fe5c9b24b5bc0dc66bd204b0665f
    container_name: equipai-postgres
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${PG_DB:-equipai}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 中设置 PG_PASSWORD}
    # 提升最大连接数到 200，避免压测 / 多客户端场景下出现 "53300: too many clients already"
    # TimescaleDB 容器默认 max_connections=25（CPU 核数自适应），对工业监控场景太小
    # shared_buffers 也从默认 128MB 提到 512MB，让更多数据驻留内存减少磁盘 IO
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pg_backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-equipai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 安全加固：postgres 进程已内置非 root 运行（postgres 用户），仅需最小权限
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 官方镜像启动时需要初始化数据目录并降权运行。
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: equipai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"
      --maxmemory 400mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    # 安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 官方镜像启动时需要先切换到 redis 用户。
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  mosquitto:
    image: eclipse-mosquitto:2@sha256:a908c65cc8e67ec9d292ef27c2c0360dbaaee7eb1b935cdd194e67697f15dea1
    container_name: equipai-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-8883}:8883"
    volumes:
      - ./mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt-certs:/mosquitto/config/certs:ro
      - mosquitto_data:/mosquitto/data
      - ./mosquitto_passwd/passwd:/mosquitto/config/passwd:ro
    # 安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 官方镜像启动时需要初始化数据目录并降权运行。
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # RabbitMQ：生产事件总线。镜像版本必须显式配置，防止旧数据卷被静默跨大版本挂载。
  # 提供持久化、每处理器独立重试和死信队列；definitions 仅包含 v2 队列策略，不含凭证。
  rabbitmq:
    image: "${RABBITMQ_IMAGE:?请设置 RABBITMQ_IMAGE，例如 rabbitmq:4.3.4-management-alpine@sha256:...}"
    container_name: equipai-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-equipai}"
      # RabbitMQ 服务始终会启动，禁止使用公开默认密码，避免管理端口暴露弱凭证。
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/start.sh:/usr/local/bin/equipai-rabbitmq-start.sh:ro
    command: ["/bin/bash", "/usr/local/bin/equipai-rabbitmq-start.sh"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
    # 安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: equipai-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      DisableRateLimiting: "${DISABLE_RATE_LIMITING:-false}"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${PG_DB:-equipai};Username=${PG_USER:-postgres};Password=${PG_PASSWORD}"
      # 只读副本连接（CQRS 读路径）：未配置 READONLY_DB_HOST 时退化为指向主库（行为与单库一致）
      # 配置独立只读副本后，纯读 QueryService（遥测、分析）路由到此库，减轻主库读压力
      ConnectionStrings__ReadOnly: "Host=${READONLY_DB_HOST:-postgres};Port=${READONLY_DB_PORT:-5432};Database=${PG_DB:-equipai};Username=${PG_USER:-postgres};Password=${PG_PASSWORD}"
      Redis__ConnectionString: "redis:6379${REDIS_PASSWORD:+,password=${REDIS_PASSWORD}}"
      Jwt__Secret: "${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}"
      Jwt__Issuer: "EquipAI"
      Jwt__Audience: "EquipAI"
      # 网关认证密钥：必须与 edgegateway 服务使用同一变量，保证两侧一致
      # ⚠️ 必须为纯 ASCII（HTTP header 不允许中文），生产环境请替换为强随机值
      Gateway__AuthKey: "${GATEWAY_AUTH_KEY:?请在 .env 中设置 GATEWAY_AUTH_KEY（纯 ASCII）}"
      # 后端主动代理网关状态/连接测试的精确主机白名单；多主机用逗号分隔
      Gateway__AllowedHosts__0: "${GATEWAY_ALLOWED_HOSTS:-edgegateway}"
      Mqtt__Host: mosquitto
      Mqtt__Port: 8883
      Mqtt__ClientIdPrefix: "equipai-backend"
      Mqtt__TopicPattern: "factory/+/telemetry/+"
      Mqtt__UseTls: "true"
      Mqtt__AllowUntrustedCertificates: "false"
      Mqtt__CaCertificatePath: "/etc/equipai/mqtt-certs/ca.crt"
      Mqtt__Username: "${MQTT_USERNAME:?请在 .env 中设置 MQTT_USERNAME}"
      Mqtt__Password: "${MQTT_PASSWORD:?请在 .env 中设置 MQTT_PASSWORD}"
      # 生产种子用户密码：禁止回退到仓库中的公开默认值
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?请在 .env 中设置 SEED_ADMIN_PASSWORD}"
      SEED_LEAD_PASSWORD: "${SEED_LEAD_PASSWORD:?请在 .env 中设置 SEED_LEAD_PASSWORD}"
      SEED_TECH_PASSWORD: "${SEED_TECH_PASSWORD:?请在 .env 中设置 SEED_TECH_PASSWORD}"
      SEED_OPERATOR_PASSWORD: "${SEED_OPERATOR_PASSWORD:?请在 .env 中设置 SEED_OPERATOR_PASSWORD}"
      SEED_VIEWER_PASSWORD: "${SEED_VIEWER_PASSWORD:?请在 .env 中设置 SEED_VIEWER_PASSWORD}"
      Llm__ApiKey: "${LLM_API_KEY:-}"
      Llm__ModelId: "${LLM_MODEL:-qwen-plus}"
      Llm__Endpoint: "${LLM_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      # v1.4 OpenTelemetry：OTLP 推送到 Jaeger（未配置则降级 Console 输出）
      # 开发环境留空 → Console exporter；生产配置 http://jaeger:4317 → OTLP exporter
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      Vapid__Subject: "${VAPID__SUBJECT:-mailto:admin@example.com}"
      Vapid__PublicKey: "${VAPID__PUBLICKEY:-}"
      Vapid__PrivateKey: "${VAPID__PRIVATEKEY:-}"
      # SMTP 邮件配置（密码重置、告警邮件通知必需）
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__FromEmail: "${SMTP_FROM_EMAIL:-}"
      Smtp__FromName: "${SMTP_FROM_NAME:-EquipSense}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__EnableSsl: "${SMTP_ENABLE_SSL:-true}"
      BEHIND_PROXY: "${BEHIND_PROXY:-true}"
      # Serilog 日志配置由 appsettings.Production.json 提供（Seq Warning+ / Console）
      # 无需通过环境变量覆盖，避免与 JSON 配置中的 WriteTo 索引冲突
      # CORS 白名单：生产环境必须显式指定前端域名（ASP.NET Core 数组环境变量格式）
      Cors__Origins__0: "${FRONTEND_URL:?请在 .env 中设置 FRONTEND_URL}"
      # AI 评估标准答案上报默认关闭；只有内部联调时显式开启并绑定固定租户/API Key
      Evaluation__AllowGroundTruthIngestion: "${EVALUATION_ALLOW_GROUND_TRUTH_INGESTION:-false}"
      Evaluation__IngestionApiKey: "${EVALUATION_INGESTION_API_KEY:-}"
      Evaluation__TenantId: "${EVALUATION_TENANT_ID:-}"
      Security__OutboundHttp__AllowPrivateNetworks: "${OUTBOUND_HTTP_ALLOW_PRIVATE_NETWORKS:-false}"
      # 生产默认使用 RabbitMQ；InMemory 只允许通过应用级 break-glass 开关显式启用。
      EventBus__Provider: "${EVENTBUS_PROVIDER:-RabbitMQ}"
      EventBus__AllowInMemoryInProduction: "${ALLOW_INMEMORY_EVENTBUS_IN_PRODUCTION:-false}"
      EventBus__RabbitMq__Host: "rabbitmq"
      EventBus__RabbitMq__Port: "5672"
      EventBus__RabbitMq__ConnectionTimeoutSeconds: "10"
      EventBus__RabbitMq__Username: "${RABBITMQ_USER:-equipai}"
      EventBus__RabbitMq__Password: "${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}"
      EventBus__Outbox__Enabled: "${EVENTBUS_OUTBOX_ENABLED:-true}"
      EventBus__Outbox__PollIntervalSeconds: "${EVENTBUS_OUTBOX_POLL_INTERVAL_SECONDS:-1}"
      EventBus__Outbox__BatchSize: "${EVENTBUS_OUTBOX_BATCH_SIZE:-50}"
      EventBus__Outbox__LeaseSeconds: "${EVENTBUS_OUTBOX_LEASE_SECONDS:-60}"
      EventBus__Outbox__MaxBackoffSeconds: "${EVENTBUS_OUTBOX_MAX_BACKOFF_SECONDS:-300}"
      EventBus__Outbox__RetentionDays: "${EVENTBUS_OUTBOX_RETENTION_DAYS:-7}"
    volumes:
      - ./mqtt-certs:/etc/equipai/mqtt-certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/startup"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 安全加固：Dockerfile 已以非 root 用户 equipai 运行，监听 8080（>1024）无需特权端口能力。
    # 仅普通网络客户端（连 PG/Redis/MQTT），可安全丢弃所有 Linux capabilities。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  # ============================================================================
  # 边缘网关：采集设备数据并通过 MQTT 上传到后端
  # ============================================================================

  edgegateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.edgegateway
    container_name: equipai-edgegateway
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-8081}:8081"
    environment:
      Gateway__Id: "${GATEWAY_ID:-gateway-001}"
      Gateway__TenantId: "${GATEWAY_TENANT_ID:-}"
      Gateway__MqttBroker: "mosquitto:8883"
      Gateway__MqttUseTls: "true"
      Gateway__MqttAllowUntrustedCertificates: "false"
      Gateway__MqttCaCertificatePath: "/app/mqtt-certs/ca.crt"
      Gateway__MqttUsername: "${MQTT_USERNAME:?请在 .env 中设置 MQTT_USERNAME}"
      Gateway__MqttPassword: "${MQTT_PASSWORD:?请在 .env 中设置 MQTT_PASSWORD}"
      Gateway__BackendUrl: "http://backend:8080"
      Gateway__AuthKey: "${GATEWAY_AUTH_KEY:-}"
      Gateway__UploadIntervalSeconds: "${GATEWAY_UPLOAD_INTERVAL:-5}"
      Gateway__Host: "edgegateway"
      Gateway__HealthPort: "8081"
      Gateway__Version: "1.0.0"
    volumes:
      - edgegateway_data:/data
      - ./mqtt-certs:/app/mqtt-certs:ro
    depends_on:
      mosquitto:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 安全加固：Dockerfile 已以非 root 用户运行，监听 8081（>1024），仅作 MQTT 客户端 + HTTP 上传
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: equipai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8443}:443"
    environment:
      BACKEND_URL: http://backend:8080
      SSL_CERT_PATH: "${SSL_CERT_PATH:-/etc/nginx/ssl/cert.pem}"
      SSL_KEY_PATH: "${SSL_KEY_PATH:-/etc/nginx/ssl/key.pem}"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # 安全加固：Nginx master 仅用于绑定 80/443，worker 会按 nginx.conf 降权为 nginx 用户；
    # 仅恢复绑定低端口所需的最小能力，其余 capability 全部丢弃。
    # tmpfs 承载 nginx 运行期 temp 文件（client body / proxy temp），避免写镜像层。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      # master 会先创建临时子目录，使用 sticky-bit 临时目录避免依赖 DAC_OVERRIDE。
      - /var/cache/nginx:mode=1777
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # 可观测性：日志聚合 + 指标采集 + 可视化仪表盘
  # ============================================================================

  seq:
    image: datalust/seq:latest@sha256:868a12e93ec0b8c993767a7dd4cd6c8ebc441511c79e4cfac66c911f62d4db65
    container_name: equipai-seq
    restart: unless-stopped
    ports:
      - "${SEQ_PORT:-5341}:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_ADMIN_PASSWORD:?请在 .env 中设置 SEQ_ADMIN_PASSWORD}"
      # 限制内存中缓存的日志量，防止日志风暴撑满内存（默认会用容器内存上限的一半）
      SEQ_MEMORY_INGEST_RAM_TARGET: "128"
      # 日志保留策略：超过 30 天的事件自动删除（可通过 SEQ_RETENTION_TIME 覆盖）
      # 格式：数字+单位（d=天, h=小时），如 7d / 30d / 90d
      SEQ_RETENTION_TIME: "${SEQ_RETENTION_TIME:-30d}"
    volumes:
      - seq_data:/data
    # 安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 官方镜像启动时需要初始化数据目录并降权运行。
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  prometheus:
    image: prom/prometheus:latest@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    container_name: equipai-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    # 安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================================
  # AlertManager — 告警路由与通知（webhook 推送到钉钉/飞书）
  # ============================================================
  alertmanager:
    image: prom/alertmanager:latest@sha256:af26fbe4dd1886ac0efd7bd55cd9027da262e105b137a376522b7c14c3626e4a
    container_name: equipai-alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    # 安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M

  grafana:
    image: grafana/grafana:latest@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: equipai-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?请在 .env 中设置 GRAFANA_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    # 安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Jaeger — OpenTelemetry 分布式追踪 UI（v1.4 接入）
  #
  # 后端通过 OTLP gRPC 推送 trace 到 Jaeger（端口 4317），
  # 用户通过 16686 访问 UI 查询跨服务调用链。
  #
  # 配置：后端 OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
  # 生产环境可换为 Tempo（与 Grafana 一体化）或 OTel Collector 多导出。
  jaeger:
    image: jaegertracing/all-in-one:1.62.0@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f
    container_name: equipai-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"   # Web UI
      - "${JAEGER_OTLP_PORT:-4317}:4317"   # OTLP gRPC（后端推送）
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"  # OTLP HTTP（备选）
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # 内存存储（重启清空），适合开发/中小规模；生产应换 Elasticsearch/Cassandra 后端
      SPAN_STORAGE_TYPE: memory
      # 限制内存使用，避免 span 暴涨
      QUERY_MAX_TRAFFIC: "1000"
    # 安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  pgdata:
  pg_backup:
  redis_data:
  mosquitto_data:
  rabbitmq_data:
  seq_data:
  prometheus_data:
  alertmanager_data:
  edgegateway_data:
  grafana_data:
