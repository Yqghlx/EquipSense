# docker/docker-compose.yml
# 生产环境：全套服务一键启动
# 使用方式：docker compose up -d
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: equipai-postgres
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${PG_DB:-equipai}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 中设置 PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pg_backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-equipai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: equipai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: equipai-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - ./mosquitto_passwd:/mosquitto/config/passwd:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: equipai-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${PG_DB:-equipai};Username=${PG_USER:-postgres};Password=${PG_PASSWORD}"
      Redis__ConnectionString: "redis:6379${REDIS_PASSWORD:+,password=${REDIS_PASSWORD}}"
      Jwt__Secret: "${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}"
      Jwt__Issuer: "EquipAI"
      Jwt__Audience: "EquipAI"
      Mqtt__Host: mosquitto
      Mqtt__Port: 1883
      Mqtt__ClientIdPrefix: "equipai-backend"
      Mqtt__TopicPattern: "factory/+/telemetry/+"
      Llm__ApiKey: "${LLM_API_KEY:-}"
      Llm__ModelId: "${LLM_MODEL:-qwen-plus}"
      Llm__Endpoint: "${LLM_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      Vapid__Subject: "${VAPID__SUBJECT:-mailto:admin@example.com}"
      Vapid__PublicKey: "${VAPID__PUBLICKEY:-}"
      Vapid__PrivateKey: "${VAPID__PRIVATEKEY:-}"
      BEHIND_PROXY: "${BEHIND_PROXY:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/startup"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: equipai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "443:443"
    environment:
      BACKEND_URL: http://backend:8080
      SSL_CERT_PATH: "${SSL_CERT_PATH:-/etc/nginx/ssl/cert.pem}"
      SSL_KEY_PATH: "${SSL_KEY_PATH:-/etc/nginx/ssl/key.pem}"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  pgdata:
  pg_backup:
  redis_data:
  mosquitto_data:
